[www]
; www = name of the pool, group of PHP worker process

; the workers run as the unprivileged www-data user, not root
user = www-data
group = www-data

; listen on TCP port 9000 so other containers can reach it
listen = 9000

; how many worker processes to keep ? depending on load
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3


; variables i pass  (database name, user ..) stay visible to WordPress
clear_env = no





